name: Validate PR 315 final state

on:
  push:
    branches:
      - fix/inbox-kpi-subchannel-filter-20260830
    paths:
      - .github/workflows/fix-pr315-blockers.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inbox-kpi-subchannel-filter-20260830

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Core
        run: pnpm run typecheck

      - name: Lint affected files
        run: >-
          pnpm exec eslint
          app/admin/channels/page.tsx
          app/admin/inbox/page.tsx
          components/admin/email-kpi-bar.tsx
          app/api/inbox/conversations/route.ts
          app/api/inbox/subchannels/route.ts
          app/api/kpi/operator-self/route.ts
          lib/platform-repositories/inbox-read.repository.ts
          lib/types/inbox-read.types.ts

      - name: Check dashboard manifest
        run: pnpm run check:dashboard

      - name: Build Core
        run: pnpm run build
