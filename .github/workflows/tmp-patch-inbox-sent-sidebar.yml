name: Temporary Inbox Sent Sidebar Patch

on:
  push:
    branches:
      - fix/inbox-sent-folder-sidebar
    paths:
      - .github/workflows/tmp-patch-inbox-sent-sidebar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/inbox-sent-folder-sidebar
          fetch-depth: 0

      - name: Add Posta inviata below Risolti
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/admin/inbox/page.tsx')
          text = path.read_text(encoding='utf-8')

          resolved = '{ id: "resolved", label: "Risolti", icon: Archive },'
          sent = '{ id: "sent", label: "Posta inviata", icon: Send },'
          click = 'onClick={() => setStatusFilter(item.id)}'
          sent_click = 'onClick={() => item.id === "sent" ? router.push("/admin/inbox/sent") : setStatusFilter(item.id)}'

          if text.count(resolved) != 1:
              raise SystemExit(f'Expected one Risolti entry, found {text.count(resolved)}')
          if text.count(sent) != 0:
              raise SystemExit('Posta inviata sidebar entry already exists')
          if text.count(click) != 1:
              raise SystemExit(f'Expected one smart-folder click handler, found {text.count(click)}')

          text = text.replace(resolved, resolved + '\n' + ' ' * 18 + sent, 1)
          text = text.replace(click, sent_click, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "hotelaccelerator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/admin/inbox/page.tsx
          git commit -m "fix(inbox): add sent folder to sidebar"
          git push origin HEAD:fix/inbox-sent-folder-sidebar
