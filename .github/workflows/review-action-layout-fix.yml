name: Review action plan layout fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-action-layout-fix.yml"

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move review action cards below charts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/reviews/reviews-operations.tsx")
          text = path.read_text()
          lines = text.splitlines()
          removed = False
          out = []
          for line in lines:
              if "insights.action_plan" in line and "Piano d&apos;azione" in line:
                  removed = True
                  continue
              out.append(line)
          if not removed:
              raise SystemExit("Inline action plan block not found")
          text = "\n".join(out) + "\n"

          review_title = '            <CardTitle className="text-base">Recensioni {total > 0 ? `(${total})` : ""}</CardTitle>'
          pos = text.find(review_title)
          if pos < 0:
              raise SystemExit("Reviews card title not found")
          insert_at = text.rfind('      <Card>\n', 0, pos)
          if insert_at < 0:
              raise SystemExit("Reviews card opening not found")

          block = '''      {(insights?.action_plan?.length || 0) > 0 ? (
        <section className="space-y-2">
          <div className="text-xs font-semibold">Piano d&apos;azione step-by-step</div>
          <div className="grid grid-cols-1 gap-3 md:grid-cols-3">
            {insights!.action_plan!.slice(0, 3).map((action) => (
              <div key={`${action.step}-${action.title}`} className="h-full rounded-lg border bg-card p-3 text-xs">
                <div className="flex items-center gap-2">
                  <Badge variant="outline">{action.step}</Badge>
                  <strong>{action.title}</strong>
                </div>
                <p className="mt-1 text-muted-foreground">{action.action}</p>
              </div>
            ))}
          </div>
        </section>
      ) : null}

'''
          text = text[:insert_at] + block + text[insert_at:]
          path.write_text(text)
          PY
      - name: Commit layout fix
        shell: bash
        run: |
          rm .github/workflows/review-action-layout-fix.yml
          git config user.name "4Bid Automation"
          git config user.email "automation@4bid.it"
          git add components/reviews/reviews-operations.tsx .github/workflows/review-action-layout-fix.yml
          git diff --cached --check
          git commit -m "fix(reviews): move action cards below charts"
          git push
