name: Temporary apply inbox AI replies patch

on:
  push:
    branches:
      - feat/inbox-ai-replies

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/inbox-ai-replies
      - name: Apply deterministic patch
        run: python3 scripts/apply-inbox-ai-replies-patch.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/inbox/page.tsx app/api/inbox/conversations/route.ts lib/types/inbox-read.types.ts lib/platform-repositories/inbox-read.repository.ts
          git commit -m "feat(inbox): surface AI replies and smart folder"
          git push origin HEAD:feat/inbox-ai-replies
