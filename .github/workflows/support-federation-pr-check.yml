name: Support federation PR check

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/integrations/support/**"
      - "lib/support-federation/**"
      - ".github/workflows/support-federation-pr-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-support-federation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Core
        run: pnpm run typecheck

      - name: Test support federation timestamp contract
        run: pnpm vitest run lib/support-federation/__tests__/contract.test.ts
