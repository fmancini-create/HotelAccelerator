name: Dashboard PR check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-core-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Core
        run: pnpm run typecheck

      - name: Test PMS learning governance
        run: pnpm vitest run lib/pms/shadow/__tests__/procedures.test.ts lib/pms/shadow/__tests__/metrics.test.ts

      - name: Test support federation timestamp contract
        run: pnpm vitest run lib/support-federation/__tests__/contract.test.ts

      - name: Test external contact qualification
        run: pnpm vitest run lib/ai/__tests__/handoff-utils.test.ts

      - name: Test HR time-clock login gate
        run: pnpm vitest run tests/mobile-login-time-clock-gate.test.ts

      - name: Test HR tenant user provisioning
        run: pnpm vitest run tests/hr-user-provisioning.test.ts

      - name: Test HR geofence map geometry
        run: pnpm vitest run tests/hr-geofence-map.test.ts

      - name: Test HR geofence admin boundary
        run: pnpm vitest run tests/hr-geofence-admin-boundary.test.ts

      - name: Test dashboard local day boundaries
        run: pnpm vitest run tests/dashboard-local-day.test.ts

      - name: Test commercial dashboard goals
        run: pnpm vitest run tests/dashboard-commercial-goals.test.ts

      - name: Test operator goal rewards
        run: pnpm vitest run tests/operator-goal-rewards.test.ts

      - name: Test operator rewards settings navigation
        run: pnpm vitest run lib/platform/__tests__/operator-rewards-nav.test.ts

      - name: Test reviews navigation
        run: pnpm vitest run lib/platform/__tests__/reviews-nav.test.ts

      - name: Test sales attribution rules
        run: pnpm vitest run tests/sales-attribution.test.ts

      - name: Test global communication alerts
        run: pnpm vitest run tests/global-communication-alerts.test.ts

      - name: Test suite directory email guard
        run: pnpm vitest run tests/suite-directory-email.test.ts

      - name: Test omnichannel Sent access
        run: pnpm vitest run lib/inbox/__tests__/sent-access.test.ts

      - name: Test Google-like Inbox search
        run: pnpm vitest run lib/inbox/__tests__/google-search-query.test.ts lib/inbox/__tests__/search-snippet.test.ts

      - name: Test telephony provider registry
        run: pnpm vitest run tests/telephony-provider-adapters.test.ts

      - name: Test telephony provider security boundary
        run: pnpm vitest run tests/telephony-provider-boundary.test.ts

      - name: Check dashboard manifest
        run: pnpm run check:dashboard
